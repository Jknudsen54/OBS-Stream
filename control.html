<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red Clay Exchange — NFL Break Board Control</title>
<style>
:root{--bg:#121110;--panel:#1d1a18;--panel2:#28231f;--text:#f7f0ea;--muted:#b8ada4;--clay:#ad5630;--clay2:#d68155;--line:#403832}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1260px;margin:0 auto;padding:22px}.header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-size:28px;margin:0}.subtitle{color:var(--muted);margin-top:6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;min-height:42px}
button:hover{border-color:var(--clay2)}button.danger{background:#35201c;border-color:#683a31}
.meta{display:grid;grid-template-columns:2fr 160px 220px;gap:10px;margin:18px 0}.meta input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.status{display:flex;align-items:center;padding:10px 13px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:700}
.notice{margin:0 0 16px;padding:12px 14px;border-radius:10px;background:#2c211b;border:1px solid #69452f;color:#f0d9c9;display:none}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.team{display:grid;grid-template-columns:52px 1fr;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;min-height:78px}
.team:hover{border-color:var(--clay2)}.team.selected{opacity:.48;background:#181716}.team.selected .teamname{text-decoration:line-through}.badge{height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--clay);font-weight:900;letter-spacing:.5px}
.teamname{font-weight:800;line-height:1.08}.buyer{margin-top:6px}.buyer input{font:inherit;width:100%;background:#141311;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 8px}
.saveState{font-size:12px;color:var(--muted);margin-top:12px}.help{margin-top:16px;padding:12px 14px;border-left:3px solid var(--clay);background:var(--panel);color:var(--muted);line-height:1.45}
@media(max-width:930px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.meta{grid-template-columns:1fr 120px}.status{grid-column:1/-1}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div><h1>Red Clay Exchange — NFL Break Board</h1><div class="subtitle">Click a team to mark it off. Click it again to restore it.</div></div>
    <div class="toolbar">
      <button id="restoreAll">Restore All Teams</button>
      <button id="markAll">Mark All Selected</button>
      <button id="clearBuyers">Clear Buyers</button>
      <button class="danger" id="reset">Reset Entire Board</button>
    </div>
  </div>

  <div id="notice" class="notice"></div>

  <div class="meta">
    <input id="breakTitle" placeholder="Break title">
    <input id="breakNumber" placeholder="Break #">
    <div class="status" id="status">Loading…</div>
  </div>

  <div id="grid" class="grid"></div>
  <div class="saveState" id="saveState">Connecting…</div>
  <div class="help"><strong>OBS sync:</strong> This page and your OBS overlay share the same Firebase room. Any team you mark here updates in OBS automatically.</div>
</div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
let TEAMS=[], state=defaultState(), saveTimer=null;

async function boot(){
  TEAMS=await (await fetch("teams.json",{cache:"no-store"})).json();
  if(!configured()){
    const n=document.getElementById("notice");
    n.style.display="block";
    n.textContent="Firebase is not configured yet. Open config.js and paste your Firebase Realtime Database URL.";
    render();
    document.getElementById("saveState").textContent="Not configured";
    return;
  }
  try{
    state=await readState();
    render();
    document.getElementById("saveState").textContent="Connected";
  }catch(e){
    showError(e.message);
    render();
  }
}
function showError(msg){
  const n=document.getElementById("notice"); n.style.display="block"; n.textContent=msg;
  document.getElementById("saveState").textContent="Connection problem";
}
function render(){
  const selectedCount=TEAMS.filter(t=>state.selected?.[t.abbr]).length;
  document.getElementById("status").textContent=`${selectedCount} selected • ${TEAMS.length-selectedCount} remaining`;
  document.getElementById("breakTitle").value=state.breakTitle||"";
  document.getElementById("breakNumber").value=state.breakNumber||"";
  document.getElementById("grid").innerHTML=TEAMS.map(t=>{
    const selected=!!state.selected?.[t.abbr], buyer=state.buyers?.[t.abbr]||"";
    return `<div class="team ${selected?"selected":""}" data-team="${t.abbr}">
      <div class="badge">${t.abbr}</div>
      <div><div class="teamname">${esc(t.name)}</div><div class="buyer"><input data-buyer="${t.abbr}" value="${esc(buyer)}" placeholder="Buyer / owner"></div></div>
    </div>`;
  }).join("");
}
async function save(){
  if(!configured()) return;
  document.getElementById("saveState").textContent="Saving…";
  try{ await writeState(state); document.getElementById("saveState").textContent="Saved • OBS updated"; }
  catch(e){ showError(e.message); }
}
function schedule(){clearTimeout(saveTimer);saveTimer=setTimeout(save,120);}

document.getElementById("grid").addEventListener("click",e=>{
  if(e.target.closest("input")) return;
  const c=e.target.closest(".team"); if(!c) return;
  state.selected ||= {}; state.selected[c.dataset.team]=!state.selected[c.dataset.team]; render(); schedule();
});
document.getElementById("grid").addEventListener("input",e=>{
  if(!e.target.matches("input[data-buyer]")) return;
  state.buyers ||= {}; state.buyers[e.target.dataset.buyer]=e.target.value; schedule();
});
document.getElementById("breakTitle").addEventListener("input",e=>{state.breakTitle=e.target.value;schedule();});
document.getElementById("breakNumber").addEventListener("input",e=>{state.breakNumber=e.target.value;schedule();});
document.getElementById("restoreAll").addEventListener("click",()=>{state.selected={};render();save();});
document.getElementById("markAll").addEventListener("click",()=>{state.selected={};TEAMS.forEach(t=>state.selected[t.abbr]=true);render();save();});
document.getElementById("clearBuyers").addEventListener("click",()=>{state.buyers={};render();save();});
document.getElementById("reset").addEventListener("click",()=>{state=defaultState();render();save();});
boot();
</script>
</body>
</html>
