<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Clay Exchange — NFL Break Board Control</title>
<style>
:root{--bg:#121110;--panel:#1d1a18;--text:#f7f0ea;--muted:#b8ada4;--clay:#ad5630;--clay2:#d68155;--line:#403832}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:28px}.subtitle{color:var(--muted);margin-top:6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{color:var(--text);background:#28231f;border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer}.meta{display:grid;grid-template-columns:2fr 150px 210px;gap:10px;margin:18px 0}.meta input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}.status{display:flex;align-items:center;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:700}.notice{display:none;margin:0 0 16px;padding:12px 14px;border-radius:10px;background:#2c211b;border:1px solid #69452f;color:#f0d9c9}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}.team{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}.team:hover{border-color:var(--clay2)}.team img{width:80%;height:80%;object-fit:contain}.team.selected{opacity:.32}.team.selected:after{content:"✓";position:absolute;right:6px;top:6px;width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--clay);font-weight:900}.save{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(6,1fr)}.meta{grid-template-columns:1fr}}@media(max-width:540px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="wrap">
<div class="header"><div><h1>Red Clay Exchange — NFL Break Board</h1><div class="subtitle">Click a logo to mark it off. Click again to restore it.</div></div><div class="toolbar"><button id="restoreAll">Restore All Teams</button><button id="markAll">Mark All Selected</button><button id="reset">Reset Entire Board</button></div></div>
<div id="notice" class="notice"></div>
<div class="meta"><input id="breakTitle" placeholder="Break title"><input id="breakNumber" placeholder="Break #"><div id="status" class="status">Loading…</div></div>
<div id="grid" class="grid"></div><div id="save" class="save">Connecting…</div></div>
<script src="config.js"></script><script src="shared.js"></script><script>
let T=[],s=defaultState(),timer;
async function boot(){T=await (await fetch("teams.json",{cache:"no-store"})).json();if(!configured()){notice.style.display="block";notice.textContent="Firebase is not configured yet.";render();save.textContent="Not configured";return;}try{s=await readState();render();save.textContent="Connected";}catch(e){notice.style.display="block";notice.textContent=e.message;render();}}
function render(){const n=T.filter(t=>s.selected?.[t.abbr]).length;status.textContent=`${n} selected • ${32-n} remaining`;breakTitle.value=s.breakTitle||"";breakNumber.value=s.breakNumber||"";grid.innerHTML=T.map(t=>`<button class="team ${s.selected?.[t.abbr]?"selected":""}" data-team="${t.abbr}" title="${t.abbr}" aria-pressed="${!!s.selected?.[t.abbr]}"><img src="${t.logo}" alt="${t.abbr} logo"></button>`).join("");}
async function saveNow(){if(!configured())return;save.textContent="Saving…";await writeState(s);save.textContent="Saved • OBS updated";}
function saveSoon(){clearTimeout(timer);timer=setTimeout(saveNow,100);}
grid.addEventListener("click",e=>{const b=e.target.closest(".team");if(!b)return;s.selected||={};s.selected[b.dataset.team]=!s.selected[b.dataset.team];render();saveSoon();});
breakTitle.addEventListener("input",e=>{s.breakTitle=e.target.value;saveSoon()});breakNumber.addEventListener("input",e=>{s.breakNumber=e.target.value;saveSoon()});
restoreAll.addEventListener("click",()=>{s.selected={};render();saveNow()});markAll.addEventListener("click",()=>{s.selected={};T.forEach(t=>s.selected[t.abbr]=true);render();saveNow()});reset.addEventListener("click",()=>{s=defaultState();render();saveNow()});boot();
</script></body></html>
