<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Clay Exchange — OBS Overlay</title>
<style>
:root{--panel:rgba(18,17,16,.94);--card:rgba(38,34,31,.94);--text:#fbf6f2;--muted:#c0b5ad;--clay:#ad5630;--line:rgba(255,255,255,.11)}
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}.board{width:100%;padding:9px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:13px}.header{display:flex;justify-content:space-between;align-items:end;gap:8px;padding:0 2px 7px;margin-bottom:7px;border-bottom:1px solid var(--line)}.brand{font-size:17px;font-weight:900;letter-spacing:.5px}.sub{font-size:9px;color:var(--muted);margin-top:2px}.counter{font-size:11px;font-weight:900;background:var(--clay);padding:5px 8px;border-radius:999px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.team{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px}.team img{width:88%;height:88%;object-fit:contain}.team.selected{opacity:.16;filter:saturate(.15)}.team.selected:after{content:"";position:absolute;left:13%;right:13%;top:49%;height:3px;background:rgba(255,255,255,.78);transform:rotate(-28deg);border-radius:3px}
</style></head><body><div class="board"><div class="header"><div><div class="brand">RED CLAY EXCHANGE</div><div id="sub" class="sub"></div></div><div id="counter" class="counter">32 LEFT</div></div><div id="grid" class="grid"></div></div>
<script src="config.js"></script><script src="shared.js"></script><script>
let T=[],last=-1;async function init(){T=await (await fetch("teams.json",{cache:"no-store"})).json();await refresh();setInterval(refresh,650)}async function refresh(){try{const s=await readState();if(s.updatedAt===last)return;last=s.updatedAt;const sel=s.selected||{},n=T.filter(t=>sel[t.abbr]).length;counter.textContent=`${32-n} LEFT`;sub.textContent=`${s.breakTitle||"NFL RANDOM TEAM BREAK"} • BREAK #${s.breakNumber||""}`;grid.innerHTML=T.map(t=>`<div class="team ${sel[t.abbr]?"selected":""}" title="${t.abbr}"><img src="${t.logo}" alt="${t.abbr}"></div>`).join("")}catch(e){}}init();
</script></body></html>
