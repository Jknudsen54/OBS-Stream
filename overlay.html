<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red Clay Exchange — OBS Overlay</title>
<style>
:root{--panel:rgba(18,17,16,.95);--card:rgba(38,34,31,.96);--text:#fbf6f2;--muted:#c0b5ad;--clay:#ad5630;--line:rgba(255,255,255,.11)}
*{box-sizing:border-box} html,body{margin:0;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.board{width:100%;padding:14px;background:var(--panel);color:var(--text);border-radius:16px;border:1px solid var(--line)}
.header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:11px;padding:1px 2px 10px;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:900;letter-spacing:.7px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.counter{background:var(--clay);padding:7px 10px;border-radius:999px;font-size:13px;font-weight:900;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.team{display:grid;grid-template-columns:45px 1fr;gap:6px;align-items:center;min-height:42px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.team.selected{opacity:.30;filter:saturate(.35)}.team.selected .name{text-decoration:line-through}.abbr{font-size:14px;font-weight:900}.name{font-size:12.5px;font-weight:800;line-height:1.05}
.buyer{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.footer{text-align:center;color:var(--muted);font-size:9.5px;letter-spacing:.7px;margin-top:8px}
.err{display:none;padding:12px;background:#311c18;color:#f7d4ca;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<div class="board">
  <div id="err" class="err"></div>
  <div class="header"><div><div class="brand">RED CLAY EXCHANGE</div><div class="sub" id="sub"></div></div><div class="counter" id="counter">32 LEFT</div></div>
  <div class="grid" id="grid"></div><div class="footer">NFL RANDOM TEAM BREAK</div>
</div>
<script src="config.js"></script><script src="shared.js"></script>
<script>
let TEAMS=[],last=-1;
async function init(){
  TEAMS=await (await fetch("teams.json",{cache:"no-store"})).json();
  if(!configured()){showErr("Firebase not configured.");return;}
  await refresh(); setInterval(refresh,650);
}
function showErr(m){const e=document.getElementById("err");e.style.display="block";e.textContent=m;}
async function refresh(){
  try{
    const s=await readState(); document.getElementById("err").style.display="none";
    if(s.updatedAt===last)return; last=s.updatedAt;
    const sel=s.selected||{},buyers=s.buyers||{},n=TEAMS.filter(t=>sel[t.abbr]).length;
    document.getElementById("counter").textContent=`${TEAMS.length-n} LEFT`;
    document.getElementById("sub").textContent=`${s.breakTitle||"NFL RANDOM TEAM BREAK"} • BREAK #${s.breakNumber||""}`;
    document.getElementById("grid").innerHTML=TEAMS.map(t=>`<div class="team ${sel[t.abbr]?"selected":""}">
      <div class="abbr">${t.abbr}</div><div><div class="name">${esc(t.name)}</div>${buyers[t.abbr]?`<div class="buyer">${esc(buyers[t.abbr])}</div>`:""}</div></div>`).join("");
  }catch(e){showErr("Waiting for break board connection…");}
}
init();
</script>
</body>
</html>
